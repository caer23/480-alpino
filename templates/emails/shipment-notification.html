<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Orden enviada</title></head>
<body style="font-family:Arial,sans-serif;background:#f5f5f5;padding:24px;">
  <table style="max-width:600px;margin:auto;background:#fff;border-radius:10px;padding:20px;">
    <tr><td>
      <h1 style="color:#1a3a47;margin-top:0;">Tu pedido está en camino 🚚</h1>
      <p>La orden <strong>{{order_id}}</strong> fue despachada.</p>
      <p><strong>Transportista:</strong> {{carrier}}</p>
      <p><strong>Número de seguimiento:</strong> {{tracking_number}}</p>
      <p><a href="{{tracking_url}}">Seguir envío</a></p>
    </td></tr>
  </table>
</body>
</html>
